name: Refresh public profile

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, preview/red-black-terminal]
    paths:
      - scripts/terminal.mjs
      - assets/ascii-knot.svg
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Animate contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: LishayGFX
          outputs: |
            assets/snake.svg?color_snake=%23f04458&color_dots=%231b1b22,%23451c29,%237f2439,%23bc3049,%23f04458
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build terminal from public data
        run: node scripts/terminal.mjs
      - name: Commit refreshed assets to the current branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal-art.svg assets/snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public profile assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
